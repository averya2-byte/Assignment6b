<!doctype html>
<html>
<head>
<style>
@import url("webfonts/Unicorns_are_Awesome_TTF/stylesheet.css");
@import url("webfonts/Brownie/stylesheet.css");

    * {
        margin: 0;
        padding: 0;
    } body {
        background: whitesmoke;
    } #page {
        width: 928px;
        height: auto;
        background: #D6AF90;
        border: 10px solid  #9F3A32;
        box-shadow: 2px 3px 6px gray;
        margin: 0 auto;
    } main {
        width: 768px;
        height: 768px;
        margin: 36px auto;
        // border: 1px dashed gray;
        display: grid;
        grid-template: repeat(3,256px) / repeat(2,384px);
    } main img {
        width: 384px;
    } main img:nth-child(1) {
        grid-area: 1/1/2/2;
    } main img:nth-child(2) {
        grid-area: 2/1/3/2;
    } main img:nth-child(3) {
        grid-area: 3/1/4/2;
    } main img:nth-child(4) {
        grid-area: 1/2/2/4;
	 } main img:nth-child(5) {
        grid-area: 3/5/5/2;
    } main p {
        font: 14pt/1.4em Georgia, serif;
        margin-bottom: 12px;
    } li {
        width: 20%;
        height: 35px;
        border-radius: 10px;
        list-style: none;
        text-align: center;
        font: 14pt/1.8em Roboto, sans-serif;
        margin: 0 auto;
        display: block;
  }
.header {
    font: "Unicorns are Awesome TTF";
    font-family: "Unicorns are Awesome TTF";text-align: center; font-size: 60px
}
.fourth {
	
}
.footer {
	text-align:center; font-size: 24px
}
</style>
</head>

<body>
    <div id="page">
      <header>
           <h1 class="header">Horse Pictures&nbsp;</h1>
        </header>
        <main>
            <img src= "annika-treial-e4WUwbcur7Y-unsplash.jpg" />&nbsp;
            <img src= "holly-mandarich-kCpCd6oQTCw-unsplash.jpg" />
			<img src= "lucia-macedo-xXLT52bAzkk-unsplash.jpg" />
			<img src="janko-ferlic--pP8Yy3ARaU-unsplash.jpg" height="600" class="fourth"/>
			<img src="jacques-bopp-aBKYaN4c25Q-unsplash.jpg" height="256"/>
        </main>
        <footer class="footer">
          <h2>Citation</h2>
          <p>All images provide courtesy of Unsplash and can be found <a href="https://unsplash.com/s/photos/horse">here.&nbsp;</a> &nbsp;</p>
      </footer>

    </div>
</body>
</html>
